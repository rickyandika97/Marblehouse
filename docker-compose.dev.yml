# OPTIONAL — you do not need this on the Mac.
#
# This Mac already runs Homebrew PostgreSQL 16 on port 5432 (the same major
# version as production), so development uses that directly. See README.
#
# This file exists only for a machine with no local Postgres. It binds host
# port 5433, NOT 5432, so it can never collide with an existing local server.
#
#   docker compose -f docker-compose.dev.yml up -d
#   # then set DATABASE_URL to ...@localhost:5433/marblehouse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata_dev:
