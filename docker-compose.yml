# Production stack. Same file works on macOS, Windows, Linux and Raspberry Pi.
#
#   docker compose up -d --build                     # app + database
#   docker compose --profile tunnel up -d --build     # + Cloudflare Tunnel
#
# The tunnel is behind a profile so it stays off during development on your Mac.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      # Named volume, NOT a bind mount. Bind-mounting Postgres data into
      # NTFS through WSL2 causes permission and performance problems.
      # Backups leave the volume via pg_dump, so recoverability is unaffected.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports published — only the app container can reach the database.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_HOST: postgres
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Bind mounts so you can see these from Finder / File Explorer.
      - ./data:/data
      - ./backups:/backups
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5050/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    profiles: ["tunnel"]

networks:
  # The ISP link here is PPPoE: real path MTU to the internet is 1492, not the
  # 1500 Docker assumes (measured 25 Aug 2026 — `ping -M do -s 1472` fails,
  # 1464 passes). 1450 leaves headroom under that.
  #
  # NOTE: this did NOT cause the 25 Aug 502s — that was a duplicate cloudflared
  # connector (see BUILD-LOG D-160). This setting is retained as correct-for-
  # this-link hygiene, not as a fix, and is untested against any known failure.
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"

volumes:
  pgdata:
